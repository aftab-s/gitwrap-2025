name: Update Contributors

on:
  push:
    branches:
      - master
      - main
  schedule:
    # Weekly refresh every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors.mjs

      - name: Commit updated contributors.json
        run: |
          if [ -n "$(git status --porcelain public/contributors.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/contributors.json
            git commit -m "chore: update contributors.json"
            git push
          else
            echo "No contributor changes detected."
          fi
